[project]
name = "petcam-selector"
version = "0.1.0"
description = "Teach the collector which photos you like: label frames, train a local model, switch it on"
requires-python = ">=3.12"
dependencies = [
    "pillow>=11",
    "numpy>=2",
    "torch>=2.4",
    "open_clip_torch>=2.26",
    "dreamsim>=0.2.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
