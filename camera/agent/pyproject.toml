[project]
name = "petcam-agent"
version = "0.1.0"
description = "On-camera agent: follows a pet with the gimbal, records visits, exposes a control API"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.black]
target-version = ["py39"]
line-length = 100
